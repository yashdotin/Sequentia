{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-panel border border-slate-800 rounded-2xl p-8">
  <h1 class="text-xl font-semibold mb-4">Set a new password</h1>
  {% if validlink %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm text-slate-300 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-xs text-red-400 mt-1">{{ field.errors.0 }}</p>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="w-full py-2 rounded-lg bg-electric hover:bg-blue-600 transition font-medium">
      Set password
    </button>
  </form>
  {% else %}
  <p class="text-slate-400">This reset link is invalid or has expired.</p>
  {% endif %}
</div>
{% endblock %}
