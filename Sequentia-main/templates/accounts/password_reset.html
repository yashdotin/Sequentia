{% extends "base.html" %}
{% block title %}Reset password · Sequentia{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-panel border border-slate-800 rounded-2xl p-8">
  <h1 class="text-xl font-semibold mb-1">Reset your password</h1>
  <p class="text-sm text-slate-400 mb-6">We'll email you a reset link.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm text-slate-300 mb-1">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    <button type="submit" class="w-full py-2 rounded-lg bg-electric hover:bg-blue-600 transition font-medium">
      Send reset link
    </button>
  </form>
</div>
{% endblock %}
